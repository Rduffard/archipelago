name: Deploy Archipelago

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-archipelago
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DEPLOY_HOST: ${{ secrets.VM_HOST }}
      DEPLOY_USER: ${{ secrets.VM_USER }}
      DEPLOY_PATH: /var/www/archipelago
      VITE_API_BASE_URL: https://api.crossworldcreative.com
      VITE_ENABLE_LINEAGE_CREATOR: 'true'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: |
          npm run build
          printf '%s\n' "$GITHUB_SHA" > dist/revision.txt

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_KEY }}

      - name: Add VM to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Ensure deploy directory exists
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"

      - name: Deploy dist to VM
        run: |
          rsync -avz --omit-dir-times --no-perms \
            dist/assets/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/assets/"
          rsync -avz --exclude='/assets/' \
            --omit-dir-times \
            --no-perms \
            dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Verify deployed revision and entry point
        run: |
          target="$DEPLOY_USER@$DEPLOY_HOST"
          test "$(ssh "$target" "cat '$DEPLOY_PATH/revision.txt'")" = "$GITHUB_SHA"
          ssh "$target" "cat '$DEPLOY_PATH/index.html'" | cmp dist/index.html -
